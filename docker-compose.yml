# Roda ao lado do Filatrix, usando as redes que ele já criou no VPS.
# O deploy/install.sh descobre os nomes das redes e grava no .env.
services:
  amigo-api:
    build: ./api
    container_name: amigo-api
    restart: unless-stopped
    env_file: .env
    networks:
      - banco
      - proxy

networks:
  banco:
    external: true
    name: ${DB_NETWORK}
  proxy:
    external: true
    name: ${PROXY_NETWORK}
